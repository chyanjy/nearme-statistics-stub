// Root Gradle build file (optional). The APK in this repo was built
// without Gradle, with the manual aapt2/d8 steps in build.sh, because
// that needs no Gradle download. If you prefer Gradle, use the
// standard Android Gradle Plugin setup with these values:
//   namespace 'com.nearme.statistics.rom'
